# Pages CMS configuration for Eleventy (11ty)
# Documentation: https://pagescms.org/docs

media:
  input: src/assets/img
  output: /assets/img

content:
  # ─────────────────────────────────────────────────────────────────
  # Blog Posts Collection
  # ─────────────────────────────────────────────────────────────────
  - name: posts
    label: Blog Posts
    type: collection
    path: src/blog
    filename: '{slug}.md'
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: description
        label: Summary / Description
        type: text
        required: true
      - name: readTime
        label: Reading Time (e.g. 5 min read)
        type: string
      - name: image
        label: Cover Image
        type: image
      - name: imageCaption
        label: Image Caption / Credit
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Post Content
        type: rich-text

  # ─────────────────────────────────────────────────────────────────
  # Projects Portfolio Collection
  # ─────────────────────────────────────────────────────────────────
  - name: projects
    label: Projects
    type: collection
    path: src/projects
    filename: '{slug}.md'
    view:
      primary: title
    fields:
      - name: title
        label: Project Name
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: category
        label: Category (e.g. Full-Stack, AI / Agentic)
        type: string
      - name: year
        label: Year (e.g. 2026)
        type: string
      - name: status
        label: Status (e.g. Live Production, Open Source)
        type: string
      - name: role
        label: Role
        type: string
      - name: timeline
        label: Timeline
        type: string
      - name: demoUrl
        label: Live Demo URL
        type: string
      - name: githubUrl
        label: GitHub URL
        type: string
      - name: image
        label: Preview Image
        type: image
      - name: imageCaption
        label: Image Caption / Credit
        type: string
      - name: tags
        label: Technologies / Tags
        type: string
        list: true
      - name: body
        label: Case Study / Content
        type: rich-text

  # ─────────────────────────────────────────────────────────────────
  # Global Site & Author Settings
  # ─────────────────────────────────────────────────────────────────
  - name: site-settings
    label: Global Site & Author Info
    type: file
    path: src/_data/site.json
    fields:
      - name: name
        label: Full Name
        type: string
        required: true
      - name: firstName
        label: First Name
        type: string
      - name: lastName
        label: Last Name
        type: string
      - name: title
        label: Professional Title
        type: string
        required: true
      - name: url
        label: Website URL
        type: string
        required: true
      - name: description
        label: Site Meta Description
        type: text
        required: true
      - name: email
        label: Contact Email
        type: string
      - name: location
        label: Location
        type: string
      - name: status
        label: Availability Status
        type: string
      - name: github
        label: GitHub URL
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: twitter
        label: Twitter / X URL
        type: string

  # ─────────────────────────────────────────────────────────────────
  # Homepage Settings
  # ─────────────────────────────────────────────────────────────────
  - name: home-settings
    label: Homepage Content
    type: file
    path: src/_data/home.json
    fields:
      - name: heroGreeting
        label: Hero Greeting (e.g. Hi, I'm)
        type: string
      - name: heroTagline
        label: Hero Tagline
        type: text
      - name: heroAvatar
        label: Avatar Image URL
        type: string
      - name: marqueeTitle
        label: Marquee Section Title (e.g. Core Programming & Frameworks)
        type: string
        default: Core Programming & Frameworks
      - name: marquee
        label: Core Programming & Frameworks (Marquee Items)
        description: Add, edit, remove, or reorder technologies that scroll in the infinite marquee.
        type: string
        list: true
      - name: bentoSectionBadge
        label: Bento Grid Section Badge
        type: string
        default: Engineering Highlights
      - name: bentoSectionTitle
        label: Bento Grid Section Title
        type: string
        default: Crafted for Scale, Speed & Precision
      - name: bentoFeatureYears
        label: Feature Card Years (e.g. 5+)
        type: string
        default: 5+
      - name: bentoFeatureTitle
        label: Feature Card Headline
        type: string
      - name: bentoFeatureDescription
        label: Feature Card Description
        type: text
      - name: bentoFeatureApps
        label: Feature Metric - Apps Shipped (e.g. 24+)
        type: string
        default: 24+
      - name: bentoFeatureUptime
        label: Feature Metric - Uptime (e.g. 99.9%)
        type: string
        default: 99.9%
      - name: bentoLocationTitle
        label: Location Title (e.g. Kolkata, India)
        type: string
        default: Kolkata, India
      - name: bentoLocationNote
        label: Location Timezone / Note
        type: string
        default: IST (UTC +5:30) • Seamless overlap with EU & US East
      - name: bentoLocationDesc
        label: Location Availability Text
        type: text
      - name: skillsSectionBadge
        label: Skills Section Badge
        type: string
      - name: skillsSectionTitle
        label: Skills Section Title
        type: string
      - name: skillCategories
        label: Skill Categories
        type: object
        list: true
        fields:
          - name: title
            label: Category Title
            type: string
          - name: icon
            label: Phosphor Icon Name (e.g. layout, server, database)
            type: string
          - name: badgeColor
            label: Badge Color (primary, secondary, accent)
            type: string
          - name: description
            label: Category Description
            type: text
          - name: skills
            label: Skill Badges
            type: string
            list: true
      - name: nowSectionTitle
        label: Now Section Title
        type: string
        default: What I'm Doing Now
      - name: nowItems
        label: Now Items (Active Focus)
        type: object
        list: true
        fields:
          - name: category
            label: Category (e.g. Active Project, Exploring, Learning, Reading)
            type: string
          - name: badge
            label: Status Badge
            type: string
          - name: icon
            label: Phosphor Icon Name (e.g. git-branch, sparkle, book-bookmark, eyeglasses)
            type: string
          - name: title
            label: Item Title
            type: string
          - name: description
            label: Description
            type: text
          - name: link
            label: Destination Link URL
            type: string
          - name: linkText
            label: Link Text (e.g. Explore Architecture, Read Notes)
            type: string
      - name: testimonialsBadge
        label: Testimonials Section Badge
        type: string
        default: Endorsements
      - name: testimonialsTitle
        label: Testimonials Section Title
        type: string
        default: What Collaborators Say
      - name: testimonials
        label: Testimonials List
        type: object
        list: true
        fields:
          - name: quote
            label: Testimonial Quote
            type: text
          - name: author
            label: Author Name
            type: string
          - name: role
            label: Author Role
            type: string
          - name: company
            label: Company / Organization
            type: string
          - name: avatar
            label: Avatar Image URL
            type: string

  # ─────────────────────────────────────────────────────────────────
  # About Page Content
  # ─────────────────────────────────────────────────────────────────
  - name: about-settings
    label: About Page Content
    type: file
    path: src/_data/about.json
    fields:
      - name: pageBadge
        label: Header Badge (e.g. about.me)
        type: string
      - name: pageTitle
        label: Page Title
        type: string
      - name: pageDescription
        label: Page Description
        type: text
      - name: experienceYears
        label: Experience Badge (e.g. 5+ Years)
        type: string
      - name: coreFocus
        label: Core Focus Label
        type: string
      - name: storyParagraphs
        label: Story Paragraphs
        type: text
        list: true
      - name: principles
        label: Guiding Principles
        type: object
        list: true
        fields:
          - name: title
            label: Principle Title
            type: string
          - name: description
            label: Principle Description
            type: text
      - name: currentFocus
        label: Current Focus List
        type: object
        list: true
        fields:
          - name: status
            label: Status Color (success, info, primary)
            type: string
          - name: text
            label: Focus Item Text
            type: string
      - name: toolkit
        label: Technical Toolkit
        type: object
        list: true
        fields:
          - name: category
            label: Category Name
            type: string
          - name: icon
            label: Phosphor Icon Name (e.g. layout, server, database, cloud)
            type: string
          - name: badgeColor
            label: Badge Color (primary, secondary, accent)
            type: string
          - name: description
            label: Category Description
            type: text
          - name: skills
            label: Skills
            type: string
            list: true

  # ─────────────────────────────────────────────────────────────────
  # Resume Content
  # ─────────────────────────────────────────────────────────────────
  - name: resume-settings
    label: Resume Content
    type: file
    path: src/_data/resume.json
    fields:
      - name: title
        label: Resume Professional Title
        type: string
      - name: summary
        label: Executive Summary
        type: text
      - name: experience
        label: Work Experience
        type: object
        list: true
        fields:
          - name: role
            label: Job Role
            type: string
          - name: company
            label: Company Name
            type: string
          - name: period
            label: Employment Period (e.g. 2023 — Present)
            type: string
          - name: location
            label: Location
            type: string
          - name: subtitle
            label: Company Subtitle / Domain
            type: string
          - name: isCurrent
            label: Is Current Role?
            type: boolean
          - name: highlights
            label: Key Achievements
            type: string
            list: true
          - name: skills
            label: Technologies Used
            type: string
            list: true
      - name: competencies
        label: Competency Groups
        type: object
        list: true
        fields:
          - name: title
            label: Group Title
            type: string
          - name: subtitle
            label: Subtitle
            type: string
          - name: color
            label: Accent Color (primary, secondary, accent)
            type: string
          - name: skills
            label: Skills
            type: string
            list: true
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - name: degree
            label: Degree
            type: string
          - name: institution
            label: School / University
            type: string
          - name: period
            label: Period (e.g. 2015 — 2019)
            type: string

  # ─────────────────────────────────────────────────────────────────
  # Photography & Gallery Settings
  # ─────────────────────────────────────────────────────────────────
  - name: gallery-settings
    label: Gallery & Photography
    type: file
    path: src/_data/gallery.json
    fields:
      - name: pageBadge
        label: Page Badge
        type: string
        default: visuals.raw
      - name: pageTitle
        label: Page Title
        type: string
        default: Visual Journal & Photography
      - name: pageDescription
        label: Description
        type: text
      - name: photos
        label: Photos Collection
        type: object
        list: true
        fields:
          - name: id
            label: Unique ID / Slug
            type: string
          - name: title
            label: Photo Title
            type: string
            required: true
          - name: image
            label: Photo Image (Upload or URL)
            type: image
            required: true
          - name: caption
            label: Caption / Description
            type: text
          - name: location
            label: Location (e.g. Tokyo, Japan)
            type: string
          - name: date
            label: Date Taken (e.g. Oct 2026)
            type: string
          - name: camera
            label: Camera & Lens (e.g. Sony A7IV • 35mm f/1.8)
            type: string

  # ─────────────────────────────────────────────────────────────────
  # Friends & Blogroll Settings
  # ─────────────────────────────────────────────────────────────────
  - name: friends-settings
    label: Friends & Blogroll
    type: file
    path: src/_data/friends.json
    fields:
      - name: pageBadge
        label: Page Badge
        type: string
        default: Community & Webring
      - name: pageTitle
        label: Page Title
        type: string
        default: Friends & Blogroll
      - name: pageDescription
        label: Page Description
        type: text
      - name: friends
        label: Friends Directory
        type: object
        list: true
        fields:
          - name: name
            label: Full Name
            type: string
            required: true
          - name: role
            label: Role / Tagline
            type: string
          - name: bio
            label: Bio / Description
            type: text
          - name: url
            label: Website / Blog URL
            type: string
            required: true
          - name: avatar
            label: Avatar Image (URL)
            type: string
          - name: tags
            label: Focus / Tags
            type: string
            list: true

# Actions accessible from Pages CMS UI
actions:
  - name: build-and-deploy
    label: Build & Deploy Site
    workflow: pages.yml
